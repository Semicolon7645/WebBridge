
services:
  webbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webbridge
    restart: unless-stopped
    init: true

    ports:
      - "8080:8080"

    environment:
      TZ: America/New_York
      NODE_ENV: production
      PORT: 8080
      CONFIG_PATH: /config
      SONGS_PATH: /songs
      FRONTEND_PATH: /app/dist/angular/browser

    volumes:
      - ./config:/config
      - ./songs:/songs

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
